apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task cleans up the workspace before cloning the repository
  workspaces:
    - name: source
  steps:
    - name: clean
      image: alpine:3
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        echo "Cleaning up workspace directory at $(workspaces.source.path) ..."
        if [ -d "$(workspaces.source.path)" ]; then
          rm -rf "$(workspaces.source.path)"/*
          rm -rf "$(workspaces.source.path)"/.[!.]*
          rm -rf "$(workspaces.source.path)"/..?*
        fi
        echo "Workspace cleaned successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task runs nose unit tests with code coverage against Python code
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      description: Arguments to pass to nosetests
      default: "-v --with-spec --spec-color --with-coverage --cover-package=service"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        echo "Installing dependencies for unit tests..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "Running nosetests..."
        nosetests $(params.args)
